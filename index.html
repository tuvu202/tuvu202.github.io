<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      #bypass-btn {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10000;
        padding: 12px 24px;
        background: rgba(255, 255, 255, 0.9);
        border: none;
        border-radius: 25px;
        font-weight: bold;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      }
      #fallback-video {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 9999;
        width: 90%;
      }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden">
    <button id="bypass-btn" onclick="showVideoDirectly()">
      Bấm vào đây để xem video 🎬
    </button>

    <div id="fallback-video">
      <video
        id="directVid"
        src="./video.mp4"
        controls
        playsinline
        loop
        style="width: 100%; border-radius: 10px"
      ></video>
    </div>

    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind;"
      color-space="sRGB"
      renderer="colorManagement: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <video
          id="filmVideo"
          src="./video.mov"
          webkit-playsinline
          playsinline
          loop
          autoplay
          muted
        ></video>
      </a-assets>
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity mindar-image-target="targetIndex: 0">
        <a-video
          src="#filmVideo"
          width="1"
          height="0.7"
          position="0 0 0.01"
        ></a-video>
      </a-entity>
    </a-scene>

    <script>
      function showVideoDirectly() {
        document.getElementById("fallback-video").style.display = "block";
        document.getElementById("directVid").play();
        document.getElementById("bypass-btn").style.display = "none";
      }
    </script>
  </body>
</html>
