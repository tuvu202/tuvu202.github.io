<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden; position: relative;">
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <video
          id="filmVideo"
          src="./video.mov"
          webkit-playsinline
          playsinline
          loop
          muted
        ></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-video
          src="#filmVideo"
          width="1"
          height="0.5"
          position="0 0 0.01"
          rotation="0 0 0"
        ></a-video>
      </a-entity>
    </a-scene>

    <button id="playButton" style="
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      padding: 14px 28px;
      border: none;
      border-radius: 999px;
      background: rgba(0,0,0,0.7);
      color: white;
      font-size: 18px;
      display: none;
    ">
      Play video
    </button>

    <div id="scanFrame" aria-hidden="true">
      <svg viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M110 185 C 95 172, 55 145, 32 121 C 10 98, 6 66, 28 47 C 48 30, 77 32, 93 47 C 100 54, 106 60, 110 65 C 114 60, 120 54, 127 47 C 143 32, 172 30, 192 47 C 214 66, 210 98, 188 121 C 165 145, 125 172, 110 185 Z"
        />
      </svg>
    </div>

    <style>
      @keyframes pulseHeart {
        0% {
          transform: translate(-50%, -50%) scale(0.96);
          opacity: 0.6;
        }
        50% {
          transform: translate(-50%, -50%) scale(1.06);
          opacity: 1;
        }
        100% {
          transform: translate(-50%, -50%) scale(0.96);
          opacity: 0.6;
        }
      }

      #scanFrame {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 220px;
        height: 220px;
        pointer-events: none;
        z-index: 20;
        display: block;
        animation: pulseHeart 1.8s ease-in-out infinite;
      }

      #scanFrame svg {
        display: block;
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 0 12px rgba(255, 118, 150, 0.9));
      }

      #scanFrame path {
        fill: rgba(255, 255, 255, 0.03);
        stroke: rgba(255, 255, 255, 0.95);
        stroke-width: 4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>

    <script>
      const scene = document.querySelector('a-scene');
      const video = document.getElementById('filmVideo');
      const playButton = document.getElementById('playButton');
      const scanFrame = document.getElementById('scanFrame');

      function enableVideo() {
        video.muted = false;
        video
          .play()
          .then(() => {
            playButton.style.display = 'none';
          })
          .catch(() => {
            console.log('Play blocked until user interaction');
          });
      }

      scene.addEventListener('targetFound', () => {
        scanFrame.style.display = 'none';
        if (video.paused) {
          playButton.style.display = 'block';
        }
      });

      scene.addEventListener('targetLost', () => {
        scanFrame.style.display = 'block';
        playButton.style.display = 'none';
      });

      playButton.addEventListener('click', () => {
        playButton.style.display = 'none';
        enableVideo();
      });
    </script>
  </body>
</html>
